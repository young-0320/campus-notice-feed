# 감시 대상 사이트 목록. check_notices.py 가 위에서 아래 순서로 순회한다.
#
# [[site]] 하나 = 홈페이지 하나.
#   name      이슈·메일에 표시되는 이름. 자유롭게 바꿔도 된다(알림 이력과 무관).
#   base      "https://<호스트>/<사이트코드>" — 게시판 주소
#             https://ee.khu.ac.kr/ee25/user/bbs/BMSR00040/list.do?menuNo=21700019
#             에서 "/user/" 앞부분.
#   filter    "all"      = 신규 글을 전부 알림 (기본값 — 생략하면 all)
#             "keywords" = 제목에 keywords.txt 의 키워드가 있는 글만 알림
#   page_size (선택) 한 페이지 글 수. 기본 30. 사이트가 30건 요청을 무시하고
#             더 적게 돌려줄 때만 그 수로 맞춘다(sitecheck.py 가 알려준다).
#   boards    ["표시명", "boardId", "menuNo"] 목록. 표시명은 자유, 뒤 둘은 주소에서.
#
# 새 사이트를 넣기 전에:  python sitecheck.py inspect https://<호스트>
# 넣은 뒤 확인:          python sitecheck.py validate
# 같은 공지가 여러 사이트에 올라오면 위쪽 사이트의 것 하나만 알린다.

